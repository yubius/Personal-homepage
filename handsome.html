<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>世界帅哥排行榜</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://img.icons8.com/ios-filled/50/000000/crown.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background-image: url('https://api.dujin.org/bing/1920.php');
        }
        .header {
            background: rgba(0,0,0,0.6);
            color: #fff;
            text-align: center;
            padding: 32px 0 16px 0;
            font-size: 2.5rem;
            letter-spacing: 4px;
            font-weight: bold;
        }
        .main-img {
            display: flex;
            justify-content: center;
            margin: 32px 0 24px 0;
        }
        .main-img img {
            width: 90vw;
            max-width: 600px;
            height: auto;
            aspect-ratio: 1284/953;
            object-fit: contain;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            border: 4px solid #fff;
            background: #eee;
            display: block;
        }
        .ranking-table {
            width: 90%;
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: rgba(255,255,255,0.92);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 16px 8px;
            text-align: center;
            font-size: 1.1rem;
        }
        th {
            background: #0078d7;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f3f7fa;
        }
        .avatar {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #0078d7;
            background: #eee;
        }
        /* 响应式适配手机端 */
        @media (max-width: 600px) {
            .header {
                font-size: 1.5rem;
                padding: 20px 0 10px 0;
            }
            .main-img img {
                width: 98vw;
                max-width: 98vw;
                height: auto;
                aspect-ratio: 1284/953;
            }
            .ranking-table {
                width: 98vw;
                max-width: 100vw;
                margin: 0 auto 20px auto;
                border-radius: 8px;
            }
            th, td {
                padding: 8px 2px;
                font-size: 0.95rem;
            }
            .avatar {
                width: 40px;
                height: 40px;
            }
        }
        @media (prefers-color-scheme: dark) {
            body {
                background-image: url('https://api.dujin.org/bing/1920.php');
                /* 可选：加深遮罩提升可读性 */
            }
            .ranking-table {
                background: rgba(30, 30, 30, 0.92);
                color: #fff;
            }
            th {
                background: #222e3c;
                color: #fff;
            }
            tr:nth-child(even) {
                background: #23272e;
            }
        }
        @media (prefers-color-scheme: light) {
            body {
                background-image: url('https://api.dujin.org/bing/1920.php');
            }
            .ranking-table {
                background: rgba(255,255,255,0.92);
                color: #222;
            }
            th {
                background: #0078d7;
                color: #fff;
            }
            tr:nth-child(even) {
                background: #f3f7fa;
            }
        }
    </style>
    <script>
        // 采用 https://cn.bing.com 官方API，拼接图片地址，兼容中国大陆
        fetch('https://cn.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1')
            .then(res => res.json())
            .then(data => {
                const imgUrl = 'https://cn.bing.com' + data.images[0].url;
                document.body.style.backgroundImage = `url('${imgUrl}')`;
            });
    </script>
</head>
<body>
    <div class="header">世界帅哥排行榜</div>
    <div class="main-img">
        <!-- 帅哥大图，替换 src 链接即可 -->
        <img src="https://img.picui.cn/free/2025/05/17/6827659853ed3.png" alt="帅哥大图">
    </div>
    <div class="ranking-table">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>名字</th>
                    <th>照片</th>
                    <th>评分</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>高家俊</td>
                    <td><img class="avatar" src="https://img.picui.cn/free/2025/05/17/682763625d8ed.jpg" alt="高家俊"></td>
                    <td>99.9</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>余雨轩</td>
                    <td><img class="avatar" src="https://img.picui.cn/free/2025/05/17/682762b32cdc7.png" alt="余雨轩"></td>
                    <td>98.7</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>田一鸣</td>
                    <td><img class="avatar" src="https://th.bing.com/th/id/R.dd2fccfac2a337e4c5bec284e32080a8?rik=QoV9LiAfEQHRpg&riu=http%3a%2f%2fi2.hdslb.com%2fbfs%2farchive%2fa23a44759c2dd0c0640170d67dd1a77bc1d434a0.jpg&ehk=lFULaseOfGyLNP91XwKqRDKUDIjhBF733BKHmr7RJ70%3d&risl=&pid=ImgRaw&r=0" alt="田一鸣"></td>
                    <td>77.5</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>余书哲</td>
                    <td><img class="avatar" src="https://img.picui.cn/free/2025/05/17/682762eb9a427.jpg" alt="余书哲"></td>
                    <td>66.3</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>丁真珍珠</td>
                    <td><img class="avatar" src="https://n.sinaimg.cn/sinakd20122/585/w970h1215/20201227/e291-kfxsuvw2781900.jpg" alt="丁真珍珠"></td>
                    <td>55.0</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
