<!DOCTYPE html>
<html lang="zh-cn">
<head>
    <meta charset="UTF-8">
    <title>世界帅哥排行榜</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            font-family: 'Segoe UI', 'Arial', sans-serif;
        }
        .header {
            background: rgba(0,0,0,0.6);
            color: #fff;
            text-align: center;
            padding: 32px 0 16px 0;
            font-size: 2.5rem;
            letter-spacing: 4px;
            font-weight: bold;
        }
        .main-img {
            display: flex;
            justify-content: center;
            margin: 32px 0 24px 0;
        }
        .main-img img {
            width: 320px;
            height: 400px;
            object-fit: cover;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.3);
            border: 4px solid #fff;
            background: #eee;
        }
        .ranking-table {
            width: 90%;
            max-width: 800px;
            margin: 0 auto 40px auto;
            background: rgba(255,255,255,0.92);
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            padding: 16px 8px;
            text-align: center;
            font-size: 1.1rem;
        }
        th {
            background: #0078d7;
            color: #fff;
        }
        tr:nth-child(even) {
            background: #f3f7fa;
        }
        .avatar {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 50%;
            border: 2px solid #0078d7;
            background: #eee;
        }
    </style>
    <script>
        // 自动设置必应每日壁纸为背景
        fetch('https://www.bing.com/HPImageArchive.aspx?format=js&idx=0&n=1')
            .then(res => res.json())
            .then(data => {
                const imgUrl = 'https://www.bing.com' + data.images[0].url;
                document.body.style.backgroundImage = `url('${imgUrl}')`;
            });
    </script>
</head>
<body>
    <div class="header">世界帅哥排行榜</div>
    <div class="main-img">
        <!-- 帅哥大图，替换 src 链接即可 -->
        <img src="https://placehold.co/320x400?text=帅哥" alt="帅哥大图">
    </div>
    <div class="ranking-table">
        <table>
            <thead>
                <tr>
                    <th>排名</th>
                    <th>名字</th>
                    <th>照片</th>
                    <th>评分</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>张三</td>
                    <td><img class="avatar" src="https://placehold.co/60x60?text=1" alt="张三"></td>
                    <td>99.9</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>李四</td>
                    <td><img class="avatar" src="https://placehold.co/60x60?text=2" alt="李四"></td>
                    <td>98.7</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>王五</td>
                    <td><img class="avatar" src="https://placehold.co/60x60?text=3" alt="王五"></td>
                    <td>97.5</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>赵六</td>
                    <td><img class="avatar" src="https://placehold.co/60x60?text=4" alt="赵六"></td>
                    <td>96.3</td>
                </tr>
                <tr>
                    <td>5</td>
                    <td>小明</td>
                    <td><img class="avatar" src="https://placehold.co/60x60?text=5" alt="小明"></td>
                    <td>95.0</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
